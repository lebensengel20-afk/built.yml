name: Build Windows App
on:
  push:
    tags:
      - 'v*' # Triggers whenever you push a tag like v1.0.0

jobs:
  release:
    runs-on: windows-latest # Bootstraps an actual Windows runtime machine!
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Rebuild SQLite
        run: |
          npm install
          
      - name: Compile Windows Executable
        run: npm run build:win

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: dist/*.exe
